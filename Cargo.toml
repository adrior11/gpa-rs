[package]
name = "gpa-rs"
version = "0.1.0"
edition = "2021"
authors = ["Adrian Schneider <adrian.schneider11@icloud.com>"]
description = "Rust-powered personal command-line GPA tracker"
repository = "https://github.com/adrior11/gpa-rs"
readme = "README.md"
keywords = ["university", "gpa", "cli"]
categories = ["command-line-utilities"]
license = "MIT"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.0", features = ["derive"] }
colored = "3.0.0" # will be removed
dirs = "6.0.0"
once_cell = "1.21.3"
ratatui = { version = "0.29.0", features = ["serde", "widget-calendar"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.0"
time = { version = "0.3.41", features = ["serde"] }
tui-textarea = "0.7.0"
uuid = { version = "1.17.0", features = ["serde", "v4"] }

[dev-dependencies]
serial_test = "3.2.0"
tempfile = "3.20.0"
