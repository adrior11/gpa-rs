[package]
name = "gpa-rs"
version = "0.1.0"
edition = "2021"
authors = ["Adrian Schneider <adrian.schneider11@icloud.com>"]
description = "Rust-powered personal command-line GPA tracker"
repository = "https://github.com/adrior11/gpa-rs"
readme = "README.md"
keywords = ["university", "gpa", "cli"]
categories = ["command-line-utilities"]
license = "MIT"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.0", features = ["derive"] }
cliclack = "0.3.6"
colored = "3.0.0"
ctrlc = "3.4.7"
dirs = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.0"

[dev-dependencies]
assert_cmd = "2.0.17"
expectrl = "0.7.1"
predicates = "3.1.3"
rstest = "0.25.0"
serial_test = "3.2.0"
tempfile = "3.20.0"
